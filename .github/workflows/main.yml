name: win 11 + tailscale + no-pass + 1080p

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025-vs2026
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings + Blank Password Policy
        run: |
          # Enable RDP and disable NLA + SecurityLayer
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          # Allow blank passwords for network logons (RDP)
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name "LimitBlankPasswordUse" -Value 0 -Force

          # Firewall rule
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with EMPTY Password
        run: |
          $password = ""   # فاضي زي مخك
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "RDP" -ErrorAction SilentlyContinue
          }

          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue

          # Force empty password again just in case
          net user RDP ""

          echo "RDP_CREDS=User: RDP | Password: (empty)" >> $env:GITHUB_ENV

      - name: Force 1920x1080 Display Settings
        run: |
          # محاولة فرض الريزولوشن عبر الريجستري (محدود على الرنر الهيدلس)
          $regPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Video"
          # إعدادات عرض عامة
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced" -Name "TaskbarDa" -Value 0 -Force -ErrorAction SilentlyContinue

          # الأفضل تسوي الريزولوشن من كلاينت الـ RDP حقك (mRemoteNG أو Windows RDP):
          # Display → 1920 x 1080
          Write-Host "Client-side resolution recommended: 1920x1080"

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 12) {
            $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            Start-Sleep -Seconds 5
            $retries++
          }

          if (-not $tsIP) {
            Write-Error "Tailscale IP not assigned"
            exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify + Keep Alive
        run: |
          Write-Host "`n=== RDP ACCESS (NO PASSWORD) ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: (leave empty)"
          Write-Host "Resolution: set 1920x1080 on your RDP client"
          Write-Host "==================`n"

          # Keep alive
          while ($true) {
            Write-Host "[$(Get-Date)] Still alive, go fuck yourself"
            Start-Sleep -Seconds 300
          }
