name: win11-no-password-rdp

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2025-vs2026
    timeout-minutes: 350

    steps:
      - name: Enable RDP + Disable Password Policy
        run: |
          # فتح الـ RDP
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Lsa" -Name "LimitBlankPasswordUse" -Value 0 -Force

          # تعطيل تعقيد كلمة المرور والطول الأدنى
          secedit /export /cfg C:\secpol.cfg
          (Get-Content C:\secpol.cfg) `
            -replace "PasswordComplexity = 1", "PasswordComplexity = 0" `
            -replace "MinimumPasswordLength = \d+", "MinimumPasswordLength = 0" `
            -replace "PasswordHistorySize = \d+", "PasswordHistorySize = 0" | 
            Set-Content C:\secpol.cfg
          secedit /configure /db C:\Windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
          Remove-Item C:\secpol.cfg -Force -ErrorAction SilentlyContinue

          # فايروول
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service TermService -Force

      - name: Create RDP User (Blank Password)
        run: |
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "RDP" -Confirm:$false
          }

          New-LocalUser -Name "RDP" -NoPassword -AccountNeverExpires
          Set-LocalUser -Name "RDP" -PasswordNeverExpires $true

          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue

          # محاولة تفريغ الباسوورد
          net user RDP "" 2>$null
          net user RDP /passwordchg:no 2>$null

          Write-Host "User RDP created"

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i `"$installerPath`" /quiet /norestart" -Wait
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

      - name: Connect Tailscale
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-rdp-$env:GITHUB_RUN_ID --accept-dns=false

          $tsIP = $null
          for ($i = 1; $i -le 15; $i++) {
            $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null
            if ($tsIP) { break }
            Start-Sleep -Seconds 4
          }

          if (-not $tsIP) {
            Write-Error "فشل تايلسكيل"
            exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP: $tsIP"

      - name: Show Info + Keep Alive
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Username : RDP"
          Write-Host "Password : (فارغ - اضغط Enter)"
          Write-Host "========================================"
          Write-Host ""

          while ($true) {
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] لسه شغال"
            Start-Sleep -Seconds 300
          }
